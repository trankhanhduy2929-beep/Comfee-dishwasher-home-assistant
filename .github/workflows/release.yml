name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build integration archive
        run: python3 build_component.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/comfee_dishwasher.zip
          dist/comfee_dishwasher.zip.sha256
          --generate-notes
          --title "Comfee / Midea Local Appliances ${GITHUB_REF_NAME}"
